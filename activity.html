<!doctype html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Attività GitHub pubblica di @scobru, in tempo quasi reale." />
  <title>@scobru — activity</title>
  <link rel="icon" href="https://avatars.githubusercontent.com/u/1079164?v=4" />
  <meta name="color-scheme" content="light dark" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inclusive+Sans:wght@300..700&family=JetBrains+Mono:wght@300..700&display=swap" rel="stylesheet" />
  <script>
    (function () {
      try {
        var t = localStorage.getItem('theme');
        var d = matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.setAttribute('data-theme', t === 'dark' || (!t && d) ? 'dark' : 'light');
      } catch (e) {}
    })();
  </script>
  <style>
    :root {
      --bg: #fbfaf4; --card: #f2f1eb; --card-hover: #e9e8e0; --text: #0e1113; --muted: #57606a;
      --border: rgba(14, 17, 19, 0.12); --accent: #1c525d;
      --font-display: "Inclusive Sans", system-ui, sans-serif; --font-mono: "JetBrains Mono", monospace;
    }
    [data-theme="dark"] {
      --bg: #121716; --card: #1d2422; --card-hover: #262f2d; --text: #fbfaf4; --muted: #9aa5a1;
      --border: rgba(251, 250, 244, 0.14); --accent: #c3d3ce;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font-display); line-height: 1.5; }
    .wrap { max-width: 760px; margin: 0 auto; padding: 2rem clamp(1.25rem, 4vw, 3rem) 4rem; }
    header { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; flex-wrap: wrap; margin-bottom: 2rem; }
    h1 { font-size: 1.5rem; margin: 0; }
    h1 span, .meta, .when, .repo { font-family: var(--font-mono); }
    h1 span, .meta { color: var(--muted); font-size: .8rem; font-weight: 400; }
    nav a { font-family: var(--font-mono); font-size: .85rem; color: var(--text); text-decoration: none; margin-left: 1rem; }
    nav a:hover, .item a:hover { color: var(--accent); }
    .item { display: grid; grid-template-columns: 2rem 1fr; gap: .75rem; padding: .85rem 1rem; margin-bottom: .5rem;
      background: var(--card); border: 1px solid var(--border); border-radius: 10px; }
    .item:hover { background: var(--card-hover); }
    .ico { font-family: var(--font-mono); color: var(--accent); font-weight: 700; text-align: center; }
    .item a { color: var(--text); text-decoration: none; }
    .what { word-break: break-word; }
    .repo { color: var(--accent); font-size: .85rem; }
    .when { color: var(--muted); font-size: .75rem; }
    .sub { color: var(--muted); font-size: .85rem; word-break: break-word; }
    #status { color: var(--muted); font-family: var(--font-mono); font-size: .85rem; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>activity <span>// @scobru</span></h1>
      <nav><a href="index.html">[ home ]</a><a href="links.html">[ links ]</a></nav>
    </header>
    <p class="meta" id="meta"></p>
    <div id="status">caricamento…</div>
    <main id="feed"></main>
  </div>
  <script>
    const USER = 'scobru', API = `https://api.github.com/users/${USER}/events/public?per_page=50`;
    const TTL = 5 * 60 * 1000; // cache 5 min: 60 req/h/IP unauthenticated limit
    const $ = id => document.getElementById(id);
    const gh = p => 'https://github.com/' + p;

    // type -> [icon, label, link, detail]; every string below is rendered via textContent
    const T = {
      PushEvent: e => ['↑', `push (${e.payload.size ?? e.payload.commits?.length ?? 0})`, gh(e.repo.name + '/commit/' + e.payload.head), e.payload.commits?.at(-1)?.message.split('\n')[0]],
      PullRequestEvent: e => ['⇄', `PR ${e.payload.pull_request.merged ? 'merged' : e.payload.action}`, e.payload.pull_request.html_url, e.payload.pull_request.title],
      IssuesEvent: e => ['!', `issue ${e.payload.action}`, e.payload.issue.html_url, e.payload.issue.title],
      IssueCommentEvent: e => ['…', 'commento', e.payload.comment.html_url, e.payload.issue.title],
      CreateEvent: e => ['+', `create ${e.payload.ref_type}`, gh(e.repo.name), e.payload.ref],
      DeleteEvent: e => ['−', `delete ${e.payload.ref_type}`, gh(e.repo.name), e.payload.ref],
      WatchEvent: e => ['★', 'star', gh(e.repo.name)],
      ForkEvent: e => ['⑂', 'fork', e.payload.forkee.html_url],
      ReleaseEvent: e => ['◆', `release ${e.payload.action}`, e.payload.release.html_url, e.payload.release.name || e.payload.release.tag_name],
    };

    const ago = d => {
      const s = (Date.now() - new Date(d)) / 1000;
      for (const [n, u] of [[86400, 'g'], [3600, 'h'], [60, 'min']]) if (s >= n) return Math.floor(s / n) + ' ' + u + ' fa';
      return 'ora';
    };

    function render(events) {
      const feed = $('feed');
      feed.replaceChildren();
      let n = 0;
      for (const e of events) {
        const f = T[e.type]; if (!f) continue;
        const [ico, label, href, sub] = f(e);
        const row = document.createElement('div'); row.className = 'item';
        const i = document.createElement('div'); i.className = 'ico'; i.textContent = ico;
        const body = document.createElement('div');
        const a = document.createElement('a'); a.href = href; a.target = '_blank'; a.rel = 'noopener';
        a.className = 'what'; a.textContent = label;
        const repo = document.createElement('span'); repo.className = 'repo'; repo.textContent = ' ' + e.repo.name;
        const when = document.createElement('div'); when.className = 'when'; when.textContent = ago(e.created_at);
        body.append(a, repo);
        if (sub) { const s = document.createElement('div'); s.className = 'sub'; s.textContent = sub; body.append(s); }
        body.append(when);
        row.append(i, body); feed.append(row); n++;
      }
      $('status').textContent = n ? '' : 'nessuna attività recente';
    }

    async function load() {
      let c; try { c = JSON.parse(localStorage.getItem('activity') || 'null'); } catch (e) {}
      if (c) render(c.data);
      if (c && Date.now() - c.t < TTL) { $('meta').textContent = 'cache · aggiornato ' + ago(c.t); return; }
      try {
        const r = await fetch(API);
        if (!r.ok) throw new Error(r.status === 403 ? 'rate limit GitHub, riprova più tardi' : 'HTTP ' + r.status);
        const data = await r.json();
        try { localStorage.setItem('activity', JSON.stringify({ t: Date.now(), data })); } catch (e) {}
        render(data); $('meta').textContent = 'aggiornato ora';
      } catch (err) {
        $('status').textContent = c ? 'offline, mostro cache' : 'errore: ' + err.message;
      }
    }
    load();
  </script>
</body>
</html>
